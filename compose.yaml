# Contract:
# 1. /app -> Host project repository ($WORK_PATH)
# 2. $VIBE_HOME -> Local sandbox persistence ($WORK_PATH/.contvibe)
# 3. $VIBE_HOME/.vibe -> Global agent state & config (./agent-state)
services:
  mistral-agent:
    build:
      context: .
      args:
        - VIBE_HOME=${VIBE_HOME}
    user: "${UA_UID}:${UA_GID}"
    working_dir: "${bind_path}"
    volumes:
      # mounts work path into the container
      - "${WORK_PATH}:${bind_path}"
      # Unified persistent home in the project sandbox
      - "${WORK_PATH}/.contvibe:${VIBE_HOME}"
      # Shared global config (API keys, etc.) overlaid on the home
      - "./agent-state:${VIBE_HOME}/.vibe"
      # Agent instructions and guidelines (read-only overlay)
      - ./AGENTS.md:${VIBE_HOME}/AGENTS.md:ro
      # Host timezone propagation (/etc/localtime is standard on Linux)
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TERM=xterm-256color
      - HOME=${VIBE_HOME}
      - EDITOR=vi
      - GIT_AUTHOR_NAME=${UA_GIT_NAME}
      - GIT_AUTHOR_EMAIL=${UA_GIT_EMAIL}
      - GIT_COMMITTER_NAME=${UA_GIT_NAME}
      - GIT_COMMITTER_EMAIL=${UA_GIT_EMAIL}
      # Modern git identity projection and trust configuration
      - GIT_CONFIG_COUNT=3
      - GIT_CONFIG_KEY_0=user.name
      - GIT_CONFIG_VALUE_0=${UA_GIT_NAME}
      - GIT_CONFIG_KEY_1=user.email
      - GIT_CONFIG_VALUE_1=${UA_GIT_EMAIL}
      - GIT_CONFIG_KEY_2=safe.directory
      - GIT_CONFIG_VALUE_2=/app
    stdin_open: true
    tty: true
